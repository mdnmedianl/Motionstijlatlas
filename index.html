<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motion Stijlatlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: contact sheet. Sticky toolbar, home = reels grouped by family, style page = 8-up clip grid. */
:root{
  --bg:#ECEEF1; --surface:#FFFFFF; --ink:#15171C; --muted:#5D6371; --line:#D3D7DE;
  --accent:#2A43DB; --accent-soft:#E3E7FB; --on-accent:#FFFFFF; --star:#D99A00; --shade:rgba(10,12,18,.62);
  --f-display:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:6px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101217; --surface:#191C23; --ink:#ECEEF2; --muted:#98A0AE; --line:#2A2F39;
    --accent:#8090FF; --accent-soft:#232A4A; --on-accent:#0E1120; --star:#F2B731; --shade:rgba(0,0,0,.66);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101217; --surface:#191C23; --ink:#ECEEF2; --muted:#98A0AE; --line:#2A2F39;
  --accent:#8090FF; --accent-soft:#232A4A; --on-accent:#0E1120; --star:#F2B731; --shade:rgba(0,0,0,.66);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* toolbar */
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;text-decoration:none;margin-right:auto}
.brand b{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:19px;letter-spacing:-.01em}
.brand span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.search{flex:1 1 260px;max-width:420px;position:relative}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;text-decoration:none;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn .n{font-family:var(--f-mono);font-size:12px;background:var(--accent-soft);color:var(--accent);padding:1px 7px;border-radius:99px}
.btn.primary .n{background:var(--on-accent);color:var(--accent)}

/* home */
.intro{padding-block:40px 8px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end}
.intro h1{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:clamp(32px,5vw,60px);line-height:.98;letter-spacing:-.025em;margin:0;text-wrap:balance}
.intro p{color:var(--muted);max-width:62ch;margin:14px 0 0}
.tally{font-family:var(--f-mono);font-size:13px;color:var(--muted);text-align:right;line-height:1.7}
.tally strong{color:var(--ink);font-weight:500}
.group{padding-block:28px 8px}
.group-head{display:flex;align-items:baseline;gap:14px;border-top:2px solid var(--ink);padding-top:10px;margin-bottom:16px;flex-wrap:wrap}
.group-head h2{font-family:var(--f-display);font-stretch:112%;font-weight:700;font-size:20px;margin:0;letter-spacing:-.01em}
.group-head p{margin:0;color:var(--muted);font-size:14px}
.reels{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px 16px}
.reel{text-decoration:none;display:flex;flex-direction:column;gap:9px;min-width:0}
.frame{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:var(--r);overflow:hidden;background:var(--line)}
.frame img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease}
.reel:hover .frame img,.clip a.thumb:hover img{transform:scale(1.045)}
.reel .tc{position:absolute;left:8px;top:8px;font-family:var(--f-mono);font-size:11px;background:var(--shade);color:#fff;padding:2px 7px;border-radius:4px;letter-spacing:.03em}
.reel h3{font-family:var(--f-display);font-stretch:108%;font-weight:700;font-size:16px;margin:0;line-height:1.2}
.reel .aka{font-size:12.5px;color:var(--muted);margin:0;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.reel .count{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.reel-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;background:repeating-linear-gradient(135deg,var(--surface) 0 10px,var(--bg) 10px 20px);color:var(--muted);font-size:11px;line-height:1.25}
.ph:not([hidden]) ~ .plat{display:none}
.ph b{font-family:var(--f-mono);font-weight:500;text-transform:uppercase;letter-spacing:.06em;font-size:10px;color:var(--accent)}

/* style page */
.crumbs{display:flex;justify-content:space-between;gap:12px;padding-block:22px 0;flex-wrap:wrap;align-items:center}
.crumbs a{font-size:14px;color:var(--muted);text-decoration:none}
.crumbs a:hover{color:var(--ink)}
.pager{display:flex;gap:8px}
.style-head{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px 48px;padding-block:18px 28px;border-bottom:1px solid var(--line)}
.eyebrow{font-family:var(--f-mono);font-size:12px;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
.style-head h1{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:clamp(30px,4.4vw,54px);line-height:1;letter-spacing:-.025em;margin:6px 0 10px;text-wrap:balance}
.style-head .aka{font-family:var(--f-mono);font-size:13px;color:var(--muted);margin:0}
.style-head .desc{font-size:16.5px;max-width:60ch;margin:0 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px;padding:0;list-style:none}
.chips li{font-size:13px;border:1px solid var(--line);background:var(--surface);padding:3px 10px;border-radius:99px}
.goodfor{font-size:14px;color:var(--muted);margin:0}
.goodfor b{color:var(--ink);font-weight:600}
.grid-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-block:20px 12px;flex-wrap:wrap}
.grid-head .count{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:18px 12px}
@media (max-width:1280px){.grid{grid-template-columns:repeat(6,minmax(0,1fr))}}
@media (max-width:960px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.style-head{grid-template-columns:1fr}}
@media (max-width:620px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.intro{grid-template-columns:1fr}.tally{text-align:left}}
.clip{position:relative;min-width:0;display:flex;flex-direction:column;gap:6px}
.clip a.thumb{display:block;text-decoration:none}
.clip .plat{position:absolute;right:6px;bottom:6px;font-family:var(--f-mono);font-size:10px;background:var(--shade);color:#fff;padding:1px 6px;border-radius:3px;letter-spacing:.04em}
.clip .title{font-size:12.5px;line-height:1.3;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.clip .title a{text-decoration:none}
.clip .title a:hover{text-decoration:underline}
.clip .tools{position:absolute;top:5px;right:5px;display:flex;gap:4px;opacity:0;transition:opacity .15s}
.clip:hover .tools,.clip:focus-within .tools,.clip.is-fav .tools{opacity:1}
@media (hover:none){.clip .tools{opacity:1}}
.tool{width:28px;height:28px;display:grid;place-items:center;border:0;border-radius:5px;background:var(--shade);color:#fff;cursor:pointer;padding:0}
.tool svg{width:15px;height:15px}
.tool.fav[aria-pressed="true"]{background:var(--star);color:#1a1300}
.clip .meta{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);margin:-2px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clip .meta.own{color:var(--accent)}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;user-select:none}
.toggle input{accent-color:var(--accent);width:16px;height:16px}
.gimg{font-size:13.5px;color:var(--accent);text-decoration:none;display:inline-flex;gap:6px;align-items:center;margin-top:10px}
.gimg:hover{text-decoration:underline}
.note{font-size:13px;color:var(--muted);margin:8px 0 0;max-width:60ch}
.group.inbox .group-head{border-top-style:dashed}
.clip.dead{opacity:.45}
.clip.dead .title::before{content:"Niet meer beschikbaar · ";color:#c0392b;font-weight:600}
.ownshot{position:absolute;left:6px;bottom:6px;font-family:var(--f-mono);font-size:10px;background:var(--accent);color:var(--on-accent);padding:1px 6px;border-radius:3px}
.reel .ownshot{display:none}
.clip.drop .frame{outline:2px dashed var(--accent);outline-offset:2px}
.clip .moved{font-family:var(--f-mono);font-size:10px;color:var(--accent)}
.empty{padding:28px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);text-align:center}

/* add form */
.add{margin-block:36px 12px;padding:18px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);display:grid;gap:10px}
.add h2{font-size:15px;margin:0;font-weight:700}
.add p{margin:0;font-size:13.5px;color:var(--muted)}
.add form{display:flex;gap:8px;flex-wrap:wrap}
.add input{flex:1 1 220px;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
.add input#add-title{flex:1 1 180px}

/* footer */
.foot{margin-top:56px;border-top:1px solid var(--line);padding-block:28px 48px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:28px}
.foot h2{font-family:var(--f-mono);font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 10px}
.foot ul{list-style:none;margin:0;padding:0;columns:2;column-gap:20px;font-size:14px}
.foot li{break-inside:avoid;padding:2px 0}
.foot li a{text-decoration:none}
.foot li a:hover{text-decoration:underline;color:var(--accent)}
.foot p{font-size:13.5px;color:var(--muted);margin:0 0 10px}
.foot .row{display:flex;gap:8px;flex-wrap:wrap}

/* menu + toast */
.menu{position:fixed;z-index:50;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 12px 32px rgba(0,0,0,.18);padding:6px;width:250px;max-height:min(420px,70vh);overflow:auto}
.menu .lab{font-family:var(--f-mono);font-size:11px;color:var(--muted);padding:6px 8px;text-transform:uppercase;letter-spacing:.06em}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 8px;border-radius:4px;font-size:13.5px;cursor:pointer}
.menu button:hover,.menu button:focus-visible{background:var(--accent-soft)}
.menu button[aria-current="true"]{color:var(--muted)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:var(--r);font-size:14px;z-index:60}
.confirm{display:inline-flex;gap:8px;align-items:center;font-size:14px}
.sel-group{padding-block:22px 6px}
.sel-group h2{font-family:var(--f-display);font-stretch:112%;font-size:19px;margin:0 0 12px;display:flex;gap:10px;align-items:baseline}
.sel-group h2 a{text-decoration:none}
.sel-group h2 span{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:400}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  set(k, v){ try{ localStorage.setItem('msa.'+k, JSON.stringify(v)); }catch(e){} }

const CAT = Object.fromEntries(DATA.cats.map(c => [c.key, c]));
const keyOf = it => it.p + ':' + it.id;

function itemsFor(catKey){
  const out = [], have = new Set();
  const push = (it, home) => { const k = keyOf(it); if(have.has(k)) return; have.add(k); out.push({...it, home}); };
  CAT[catKey].items.forEach(it => { const m = moves[keyOf(it)]; if(!m || m === catKey) push(it, catKey); });
  DATA.cats.forEach(c => c.items.forEach(it => { if(c.key !== catKey && moves[keyOf(it)] === catKey) push(it, c.key); }));
  custom.forEach(it => { if((moves[keyOf(it)] || it.cat) === catKey) push(it, 'eigen'); });
  return showDead ? out : out.filter(it => !isDead(keyOf(it)));
}
function findItem(k){
  for(const c of DATA.cats) for(const it of c.items) if(keyOf(it) === k) return it;
  return custom.find(it => keyOf(it) === k);
}
function catOfItem(k){
  if(moves[k]) return moves[k];
  for(const c of DATA.cats) if(c.items.some(it => keyOf(it) === k)) return c.key;
  const cu = custom.find(it => keyOf(it) === k); return cu ? cu.cat : null;
}

                 : it.p === 'v' ? `https://vimeo.com/${it.id}` : it.u;
const metaLine = it => [it.s, it.y].filter(Boolean).join(' · ');
const platName = p => p === 'y' ? 'YouTube' : p === 'v' ? 'Vimeo' : p === 'c' ? 'Studio' : p === 'w' ? 'Website' : 'Link';
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function frameHTML(it, extra=''){
  const own = shots.get(keyOf(it));
  const src = own || thumb(it);
  if(own) extra += `<span class="ownshot">eigen</span>`;
  const ph = `<div class="ph"${src ? ' hidden' : ''}><b>${platName(it.p)}</b>${esc(it.t)}</div>`;
  const img = src ? `<img src="${src}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.hidden=true;this.nextElementSibling.hidden=false">` : '';
  return `<div class="frame">${img}${ph}${extra}</div>`;
}
function parseUrl(u){
  u = u.trim(); let m;
  if((m = u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/))([\w-]{11})/))) return {p:'y', id:m[1]};
  if((m = u.match(/vimeo\.com\/(?:.*\/)?(\d{5,})/))) return {p:'v', id:m[1]};
  if(/^https?:\/\//i.test(u)) return {p:'o', id:u, u};
  return null;
}

const shots = new Map();
let idb = null;
function idbOpen(){ return new Promise(res => { try{ const r = indexedDB.open('msa', 1); r.onupgradeneeded = () => r.result.createObjectStore('shots'); r.onsuccess = () => res(r.result); r.onerror = () => res(null); }catch(e){ res(null); } }); }
async function shotsLoad(){
  idb = await idbOpen(); if(!idb) return;
  await new Promise(res => { try{ const rq = idb.transaction('shots').objectStore('shots').openCursor();
    rq.onsuccess = () => { const c = rq.result; if(c){ shots.set(c.key, c.value); c.continue(); } else res(); }; rq.onerror = () => res(); }catch(e){ res(); } });
}
function shotPut(k, v){ shots.set(k, v); if(idb) try{ idb.transaction('shots','readwrite').objectStore('shots').put(v, k); }catch(e){} }
function shotDel(k){ shots.delete(k); if(idb) try{ idb.transaction('shots','readwrite').objectStore('shots').delete(k); }catch(e){} }
function shotsClear(){ shots.clear(); if(idb) try{ idb.transaction('shots','readwrite').objectStore('shots').clear(); }catch(e){} }
function fileToThumb(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const W = 640, H = 360, c = document.createElement('canvas'); c.width = W; c.height = H;
      const sc = Math.max(W / im.width, H / im.height), w = im.width * sc, h = im.height * sc;
      c.getContext('2d').drawImage(im, (W - w) / 2, (H - h) / 2, w, h);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.82));
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(); };
    im.src = url;
  });
}
async function setShot(k, file){
  if(!file || !/^image\//.test(file.type)){ toast('Dat is geen afbeelding. Gebruik een PNG, JPG of WebP.'); return; }
  try{ shotPut(k, await fileToThumb(file)); render(); toast('Screenshot opgeslagen'); }
  catch(e){ toast('Deze afbeelding kon niet worden gelezen'); }
}

function checkYouTube(id){
  return new Promise(res => { const im = new Image(); im.referrerPolicy = 'no-referrer';
    im.onload = () => res(im.naturalWidth > 120 ? {ok:true} : {ok:false}); im.onerror = () => res(null);
    im.src = `https://i.ytimg.com/vi/${id}/mqdefault.jpg`; });
}
async function checkVimeo(id){

    const r = await fetch(`https://vimeo.com/api/oembed.json?url=${encodeURIComponent('https://vimeo.com/' + id)}&width=640`);
    if(r.status === 404 || r.status === 403) return {ok:false};
    if(!r.ok) return null;
    const j = await r.json();
    return {ok:true, th: j.thumbnail_url ? j.thumbnail_url.replace(/_\d+x\d+/, '_640x360') : undefined};
  }catch(e){ return null; }   // geen verbinding of geblokkeerd: niets verbergen
}

    if(it.p !== 'v' && it.p !== 'y') return;
    const a = alive[keyOf(it)]; if(a && Date.now() - a.t < WEEK) return;
    todo.push(it);
  }));
  let changed = 0;
  const worker = async () => {
    while(todo.length){
      const it = todo.shift();
      const res = it.p === 'y' ? await checkYouTube(it.id) : await checkVimeo(it.id);
      if(res){ alive[keyOf(it)] = {...res, t: Date.now()}; changed++;
        if(changed % 20 === 0){ store.set('alive', alive); scheduleRender(); } }
      await new Promise(r => setTimeout(r, 150));
    }
  };
  await Promise.all([worker(), worker(), worker()]);
  store.set('alive', alive); checking = false; scheduleRender();
}
function scheduleRender(){ clearTimeout(checkTimer); checkTimer = setTimeout(() => { if(menu.hidden && !document.activeElement.matches('input')) render(); }, 400); }

/* ---------- views ---------- */
const app = document.getElementById('app');
const q = document.getElementById('q');
const totalClips = () => DATA.cats.reduce((n,c) => n + itemsFor(c.key).length, 0);

function renderHome(){
  const term = q.value.trim().toLowerCase();
  let idx = 0;
  const groups = DATA.groups.map(g => {
    const cats = DATA.cats.filter(c => c.group === g.key);
    const cards = cats.map(c => {
      idx++;
      const list = itemsFor(c.key);
      const hay = (c.name + ' ' + c.aka + ' ' + c.desc + ' ' + list.map(i=>i.t).join(' ')).toLowerCase();
      if(term && !hay.includes(term)) return '';
      const first = list.find(i => i.own) || list[0];
      const tc = `R${String(idx).padStart(2,'0')}`;
      return `<a class="reel" href="#s-${c.key}">
        ${first ? frameHTML(first, `<span class="tc">${tc}</span>`) : `<div class="frame"><div class="ph"><b>Leeg</b></div><span class="tc">${tc}</span></div>`}
        <div class="reel-top"><h3>${esc(c.name)}</h3><span class="count">${String(list.length).padStart(2,'0')} clips</span></div>
        <p class="aka">${esc(c.aka)}</p>
      </a>`;
    }).join('');
    if(!cards.trim()) return '';
    return `<section class="group${g.key === 'inbox' ? ' inbox' : ''}"><div class="group-head"><h2>${esc(g.name)}</h2><p>${esc(g.desc)}</p></div><div class="reels">${cards}</div></section>`;
  }).join('');

  app.innerHTML = `
    <section class="intro">
      <div>
        <h1>${DATA.cats.filter(c=>c.group!=='inbox').length} stijlen motion design, naast elkaar.</h1>
        <p>Kies een stijl om de voorbeelden te zien. Alle voorbeelden zijn van 2019 of later. Werk van de studio's uit jouw lijst staat vooraan en is blauw gelabeld. Klik op een thumbnail om de video te openen en markeer met de ster wat aanspreekt; onder <a href="#selectie">Selectie</a> staat alles bij elkaar om met de klant door te nemen. Studiowerk dat nog niet is ingedeeld staat onderaan in de inbox.</p>
      </div>
      <div class="tally"><strong>${DATA.cats.filter(c=>c.group!=='inbox').length}</strong> stijlen<br><strong>${DATA.cats.reduce((n,c)=>n+itemsFor(c.key).filter(i=>i.own).length,0)}</strong> van jouw studio's<br><strong>${totalClips()}</strong> voorbeelden<br><strong>${favs.size}</strong> in selectie</div>
    </section>
    ${groups || `<div class="empty" style="margin-top:28px">Geen stijl gevonden voor "${esc(q.value)}".</div>`}
    ${footerHTML()}`;
}

function clipHTML(it, catKey){
  const k = keyOf(it), fav = favs.has(k);
  const moved = it.home !== catKey ? `<span class="moved">${it.home === 'eigen' ? 'zelf toegevoegd' : 'verplaatst uit ' + esc(CAT[it.home].name)}</span>` : '';
  return `<div class="clip${fav ? ' is-fav' : ''}${isDead(k) ? ' dead' : ''}" data-k="${esc(k)}">
    <a class="thumb" href="${esc(link(it))}" target="_blank" rel="noopener" title="${esc(it.t)}">${frameHTML(it, `<span class="plat">${platName(it.p)}</span>`)}</a>
    <div class="tools">
      <button class="tool fav" data-act="fav" aria-pressed="${fav}" aria-label="${fav ? 'Uit selectie halen' : 'Aan selectie toevoegen'}" title="${fav ? 'Uit selectie' : 'Aan selectie toevoegen'}"><svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 3 2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 16.8 6.6 19.7l1.1-6.1L3.2 9.4l6.1-.8z"/></svg></button>
      <button class="tool" data-act="menu" aria-haspopup="menu" aria-label="Verplaats naar andere stijl" title="Verplaats naar andere stijl"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
    </div>
    <p class="title"><a href="${esc(link(it))}" target="_blank" rel="noopener">${esc(it.t)}</a></p>
    ${metaLine(it) ? `<p class="meta${it.own ? ' own' : ''}">${esc(metaLine(it))}</p>` : ''}
    ${moved}
  </div>`;
}

function renderStyle(key){
  const c = CAT[key]; if(!c){ location.hash = ''; return; }
  const i = DATA.cats.indexOf(c), prev = DATA.cats[i-1], next = DATA.cats[i+1];
  const g = DATA.groups.find(g => g.key === c.group);
  const term = q.value.trim().toLowerCase();
  const list = itemsFor(key);
  let shown = term ? list.filter(it => (it.t + ' ' + (it.s||'')).toLowerCase().includes(term)) : list;
  if(onlyOwn) shown = shown.filter(it => it.own);
  app.innerHTML = `
    <nav class="crumbs" aria-label="Navigatie">
      <a href="#">← Alle stijlen</a>
      <div class="pager">
        ${prev ? `<a class="btn" href="#s-${prev.key}" title="${esc(prev.name)}">← Vorige</a>` : ''}
        ${next ? `<a class="btn" href="#s-${next.key}" title="${esc(next.name)}">Volgende →</a>` : ''}
      </div>
    </nav>
    <section class="style-head">
      <div>
        <div class="eyebrow">${esc(g.name)} · R${String(i+1).padStart(2,'0')}</div>
        <h1>${esc(c.name)}</h1>
        <p class="aka">Ook: ${esc(c.aka)}</p>
        ${c.query ? `<a class="gimg" href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(c.query)}" target="_blank" rel="noopener">Bekijk "${esc(c.query)}" in Google Afbeeldingen ↗</a>` : ''}
        ${c.note ? `<p class="note">${esc(c.note)}</p>` : ''}
      </div>
      <div>
        <p class="desc">${esc(c.desc)}</p>
        <ul class="chips">${c.traits.map(t => `<li>${esc(t)}</li>`).join('')}</ul>
        <p class="goodfor"><b>Werkt goed voor:</b> ${esc(c.goodFor)}</p>
      </div>
    </section>
    <div class="grid-head"><span class="count">${shown.length}${term ? ' van ' + list.length : ''} voorbeelden${term ? ' met "' + esc(q.value) + '"' : ''}</span><label class="toggle"><input type="checkbox" id="own-only" ${onlyOwn ? 'checked' : ''}> Alleen studio's uit jouw lijst</label><span class="count">Klik = video · ★ = selectie · ⋯ = verplaatsen · rechtsklik = eigen screenshot</span></div>
    ${shown.length ? `<div class="grid">${shown.map(it => clipHTML(it, key)).join('')}</div>` : `<div class="empty">Nog geen voorbeelden${term ? ' die passen bij deze zoekterm' : ''}. Voeg hieronder een link toe.</div>`}
    <section class="add" aria-labelledby="add-h">
      <h2 id="add-h">Voorbeeld toevoegen aan ${esc(c.name)}</h2>
      <p>Plak een YouTube- of Vimeo-link, of gewoon de link naar een projectpagina van een studio. Bij een projectpagina maakt de tool automatisch een screenshot als thumbnail (dat kan bij de eerste keer laden een paar seconden duren). Toevoegingen worden in deze browser bewaard.</p>
      <form id="add-form">
        <input id="add-url" type="url" placeholder="https://vimeo.com/123456789" required aria-label="Videolink">
        <input id="add-title" type="text" placeholder="Titel (bijv. Studio – Project)" aria-label="Titel">
        <button class="btn primary" type="submit">Toevoegen</button>
      </form>
    </section>
    ${footerHTML()}`;
  document.getElementById('own-only').addEventListener('change', e => { onlyOwn = e.target.checked; store.set('own', onlyOwn); render(); });
  document.getElementById('add-form').addEventListener('submit', e => {
    e.preventDefault();
    const url = document.getElementById('add-url').value, title = document.getElementById('add-title').value.trim();
    const parsed = parseUrl(url);
    if(!parsed){ toast('Dit is geen geldige link. Begin met https://'); return; }
    const k = keyOf(parsed);
    const existing = catOfItem(k);
    if(existing){ toast(`Staat al onder ${CAT[existing] ? CAT[existing].name : 'een stijl'}`); return; }
    custom.push({cat:key, ...parsed, t: title || (platName(parsed.p) + ' ' + (parsed.p === 'o' ? new URL(parsed.u).hostname : parsed.id))});
    save(); render(); toast('Toegevoegd');
  });
}

function renderSelection(){
  const groups = DATA.cats.map(c => {
    const list = itemsFor(c.key).filter(it => favs.has(keyOf(it)));
    if(!list.length) return '';
    return `<section class="sel-group"><h2><a href="#s-${c.key}">${esc(c.name)}</a><span>${list.length}</span></h2><div class="grid">${list.map(it => clipHTML(it, c.key)).join('')}</div></section>`;
  }).join('');
  app.innerHTML = `
    <nav class="crumbs"><a href="#">← Alle stijlen</a>
      <div class="pager" id="sel-actions">
        <button class="btn" data-act="copy-sel" ${favs.size ? '' : 'disabled'}>Kopieer als lijst</button>
        <button class="btn" data-act="clear-sel" ${favs.size ? '' : 'disabled'}>Selectie wissen</button>
      </div>
    </nav>
    <section class="style-head" style="grid-template-columns:1fr">
      <div><div class="eyebrow">Selectie</div><h1>Shortlist voor de klant</h1>
      <p class="desc">${favs.size ? `${favs.size} voorbeelden, gegroepeerd per stijl. Kopieer de lijst om hem te mailen of in een briefing te plakken.` : 'Nog leeg. Open een stijl en klik op de ster bij een voorbeeld om het hier te verzamelen.'}</p></div>
    </section>
    ${groups || ''}
    ${footerHTML()}`;
}

function footerHTML(){
  return `<footer class="foot">
    <div><h2>Studio's om te doorzoeken</h2><ul>${DATA.studios.map(s => `<li><a href="${esc(s.u)}" target="_blank" rel="noopener">${esc(s.n)}</a></li>`).join('')}</ul></div>
    <div><h2>Meer inspiratie</h2><ul style="columns:1">${DATA.inspiration.map(s => `<li><a href="${esc(s.u)}" target="_blank" rel="noopener">${esc(s.n)}</a></li>`).join('')}</ul></div>
    <div><h2>Jouw indeling</h2>
      <p>Verplaatsingen, toevoegingen, je selectie en eigen screenshots worden in deze browser bewaard. Download je indeling om hem te bewaren, op een andere computer te openen of te delen met een collega.</p>
      <div class="row"><button class="btn" data-act="export">Download indeling</button><button class="btn" data-act="import-file">Importeer bestand</button><button class="btn" data-act="reset">Herstel standaard</button></div>
      ${deadList().length ? `<p style="margin-top:12px"><b>${deadList().length} video's bestaan niet meer</b> en zijn verborgen. <button class="btn" data-act="toggle-dead" style="margin-top:6px">${showDead ? 'Verberg ze weer' : 'Toon ze toch'}</button></p>` : `<p style="margin-top:12px">Linkcontrole: ${checking ? 'bezig…' : 'alle gecontroleerde video\'s werken.'}</p>`}
      <p style="margin-top:12px">Thumbnails komen van YouTube, Vimeo (via vumbnail.com), het voorbeeldbeeld van de projectpagina of een automatische screenshot (via WordPress mShots). Ze laden alleen met internet.</p>
    </div>
  </footer>`;
}

/* ---------- router ---------- */
let lastRoute = null;
function render(){
  const h = location.hash.slice(1);
  if(h !== lastRoute){ if(lastRoute !== null) q.value = ''; lastRoute = h; window.scrollTo(0,0); }
  if(h.startsWith('s-')) renderStyle(h.slice(2));
  else if(h === 'selectie') renderSelection();
  else renderHome();
  document.getElementById('sel-n').textContent = favs.size;
  document.getElementById('brand-count').textContent = `${DATA.cats.filter(c=>c.group!=='inbox').length} stijlen · ${totalClips()} clips`;
  q.placeholder = h.startsWith('s-') ? 'Zoek in deze stijl…' : 'Zoek een stijl of video…';
}
window.addEventListener('hashchange', render);
q.addEventListener('input', () => {
  const pos = q.selectionStart; render(); q.focus(); try{ q.setSelectionRange(pos,pos); }catch(e){}
});

/* ---------- actions ---------- */
const menu = document.getElementById('menu');
let menuFor = null;
function shotItems(k){
  return `<div class="lab">Thumbnail</div><button role="menuitem" data-shot="upload">Screenshot uploaden…</button><button role="menuitem" data-shot="paste">Screenshot plakken (Ctrl/⌘+V)</button>${shots.has(k) ? '<button role="menuitem" data-shot="del">Eigen screenshot verwijderen</button>' : ''}`;
}
let menuRect = null;
function placeMenu(r){
  menuRect = r; menu.hidden = false;
  const w = menu.offsetWidth, h = menu.offsetHeight;
  let left = Math.min(r.right - w, window.innerWidth - w - 12); left = Math.max(12, left);
  let top = r.bottom + 6; if(top + h > window.innerHeight - 12) top = Math.max(12, r.top - h - 6);
  menu.style.left = left + 'px'; menu.style.top = top + 'px';
}
function openShotMenu(x, y, k){
  menuFor = k;
  menu.innerHTML = shotItems(k) + `<hr><button role="menuitem" data-shot="move">Verplaats naar andere stijl…</button>`;
  placeMenu({left:x, right:x + 250, top:y, bottom:y});
  const first = menu.querySelector('button'); first && first.focus();
}
function openMenu(btn, k){
  menuFor = k;
  const cur = catOfItem(k);
  menu.innerHTML = shotItems(k) + `<hr><div class="lab">Verplaats naar</div>` + DATA.groups.map(g =>
    `<hr><div class="lab">${esc(g.name)}</div>` + DATA.cats.filter(c => c.group === g.key).map(c =>
      `<button role="menuitem" data-move="${c.key}" ${c.key === cur ? 'aria-current="true"' : ''}>${c.key === cur ? '✓ ' : ''}${esc(c.name)}</button>`).join('')
  ).join('') + (custom.some(it => keyOf(it) === k) ? `<hr><button role="menuitem" data-remove="1">Verwijder dit voorbeeld</button>` : '');
  placeMenu(btn.getBoundingClientRect ? btn.getBoundingClientRect() : btn);
  const first = menu.querySelector('button:not([aria-current])'); first && first.focus();
}
function closeMenu(){ menu.hidden = true; menuFor = null; }

menu.addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b || !menuFor) return;
  const k = menuFor;
  if(b.dataset.shot){
    const a = b.dataset.shot;
    if(a === 'upload'){ closeMenu(); pickFor = k; filePick.click(); }
    else if(a === 'paste'){ closeMenu(); pasteFor = k; toast('Druk nu op Ctrl+V (Mac: ⌘V) om de screenshot te plakken'); }
    else if(a === 'del'){ closeMenu(); shotDel(k); render(); toast('Eigen screenshot verwijderd'); }
    else if(a === 'move'){ const r = menuRect; openMenu(r, k); }
    return;
  }
  if(b.dataset.remove){
    custom = custom.filter(it => keyOf(it) !== k); delete moves[k]; favs.delete(k);
    save(); closeMenu(); render(); toast('Verwijderd'); return;
  }
  const to = b.dataset.move;
  const it = findItem(k);
  const orig = it && it.cat ? it.cat : DATA.cats.find(c => c.items.some(x => keyOf(x) === k))?.key;
  if(to === orig) delete moves[k]; else moves[k] = to;
  save(); closeMenu(); render(); toast(`Verplaatst naar ${CAT[to].name}`);
});

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if(!t){ if(!menu.hidden && !e.target.closest('#menu')) closeMenu(); return; }
  const act = t.dataset.act, clip = t.closest('.clip'), k = clip && clip.dataset.k;
  if(act === 'fav'){
    favs.has(k) ? favs.delete(k) : favs.add(k); save();
    const on = favs.has(k);
    if(location.hash === '#selectie') render();
    else { t.setAttribute('aria-pressed', on); clip.classList.toggle('is-fav', on); document.getElementById('sel-n').textContent = favs.size; }
    toast(on ? 'Aan selectie toegevoegd' : 'Uit selectie gehaald');
  }
  else if(act === 'menu'){ e.stopPropagation(); menuFor === k && !menu.hidden ? closeMenu() : openMenu(t, k); }
  else if(act === 'copy-sel'){
    const lines = [];
    DATA.cats.forEach(c => { const l = itemsFor(c.key).filter(it => favs.has(keyOf(it))); if(l.length){ lines.push(c.name.toUpperCase()); l.forEach(it => lines.push(`- ${it.t}: ${link(it)}`)); lines.push(''); } });
    copy(lines.join('\n'), 'Selectie gekopieerd');
  }
  else if(act === 'clear-sel'){
    const box = document.getElementById('sel-actions');
    box.innerHTML = `<span class="confirm">Alles uit de selectie halen? <button class="btn primary" data-act="clear-yes">Ja, wissen</button><button class="btn" data-act="clear-no">Annuleren</button></span>`;
  }
  else if(act === 'clear-yes'){ favs.clear(); save(); render(); toast('Selectie gewist'); }
  else if(act === 'clear-no'){ render(); }
  else if(act === 'toggle-dead'){ showDead = !showDead; render(); }
  else if(act === 'export'){
    const blob = new Blob([JSON.stringify({favs:[...favs], moves, custom, shots:Object.fromEntries(shots)})], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'motion-stijlatlas-indeling.json';
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    toast('Indeling gedownload, inclusief eigen screenshots');
  }
  else if(act === 'import-file'){
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
    inp.onchange = async () => { try{ const d = JSON.parse(await inp.files[0].text());
      favs = new Set(d.favs || []); moves = d.moves || {}; custom = d.custom || []; save();
      shotsClear(); Object.entries(d.shots || {}).forEach(([k, v]) => shotPut(k, v));
      render(); toast('Indeling geïmporteerd'); }catch(err){ toast('Dit bestand kon niet worden gelezen. Kies een geëxporteerde indeling (.json).'); } };
    inp.click();
  }
  else if(act === 'import'){
    const row = t.parentElement;
    row.outerHTML = `<form class="row" id="imp"><input id="imp-json" style="flex:1 1 200px;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg)" placeholder="Plak hier de geëxporteerde JSON" aria-label="JSON"><button class="btn primary">Importeer</button></form>`;
    document.getElementById('imp').addEventListener('submit', ev => {
      ev.preventDefault();
      try{ const d = JSON.parse(document.getElementById('imp-json').value);
        favs = new Set(d.favs || []); moves = d.moves || {}; custom = d.custom || []; save(); render(); toast('Indeling geïmporteerd');
      }catch(err){ toast('Kon de JSON niet lezen. Plak de volledige export.'); }
    });
  }
  else if(act === 'reset'){
    const row = t.parentElement;
    row.innerHTML = `<span class="confirm">Verplaatsingen, toevoegingen, selectie en eigen screenshots wissen? <button class="btn primary" data-act="reset-yes">Ja</button><button class="btn" data-act="reset-no">Nee</button></span>`;
  }
  else if(act === 'reset-yes'){ favs = new Set(); moves = {}; custom = []; shotsClear(); save(); render(); toast('Standaardindeling hersteld'); }
  else if(act === 'reset-no'){ render(); }
});
document.addEventListener('contextmenu', e => {
  const clip = e.target.closest('.clip'); if(!clip) return;
  e.preventDefault(); openShotMenu(e.clientX, e.clientY, clip.dataset.k);
});
document.addEventListener('mouseover', e => { const c = e.target.closest('.clip'); hoverKey = c ? c.dataset.k : hoverKey; });
document.addEventListener('paste', e => {
  const img = [...(e.clipboardData ? e.clipboardData.items : [])].find(i => i.type.startsWith('image/'));
  if(!img) return;
  const k = pasteFor || (document.activeElement && document.activeElement.closest && document.activeElement.closest('.clip') ? document.activeElement.closest('.clip').dataset.k : null);
  if(!k){ toast('Rechtsklik eerst op een thumbnail en kies "Screenshot plakken"'); return; }
  e.preventDefault(); pasteFor = null; setShot(k, img.getAsFile());
});
document.addEventListener('dragover', e => { const c = e.target.closest('.clip'); if(c && e.dataTransfer && [...e.dataTransfer.types].includes('Files')){ e.preventDefault(); c.classList.add('drop'); } });
document.addEventListener('dragleave', e => { const c = e.target.closest('.clip'); c && c.classList.remove('drop'); });
document.addEventListener('drop', e => { const c = e.target.closest('.clip'); if(!c) return; e.preventDefault(); c.classList.remove('drop'); const f = e.dataTransfer.files[0]; if(f) setShot(c.dataset.k, f); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && !menu.hidden) closeMenu(); });
window.addEventListener('scroll', () => { if(!menu.hidden) closeMenu(); }, {passive:true});

function copy(text, msg){
  const done = () => toast(msg);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, msg));
  } else fallbackCopy(text, msg);
}
function fallbackCopy(text, msg){
  const ta = document.createElement('textarea'); ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast(msg); }catch(e){ toast('Kopiëren lukte niet'); }
  ta.remove();
}
let tt;
function toast(msg){ const el = document.getElementById('toast'); el.textContent = msg; el.hidden = false; clearTimeout(tt); tt = setTimeout(() => el.hidden = true, 2200); }

render();
shotsLoad().then(() => { if(shots.size) render(); });
setTimeout(runLinkCheck, 800);
</script>
